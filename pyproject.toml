[project]
name = "esr"
version = "0.1.0"
description = "Replication of Endogenous Steering Resistance (McKenzie et al., 2026) on Gemma-2 with Gemma Scope SAEs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.9",
    "sae-lens>=6.40",
    "transformers>=4.55",
    "accelerate",
    "anthropic>=0.60",
    "python-dotenv",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "seaborn",
    "tqdm",
    "huggingface_hub",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
