# conda env for the ESR replication. Torch must come from the CUDA 12.8 wheel index, so it is
# installed with pip (or `uv pip --torch-backend=cu128`, which reuses uv's download cache):
#   conda env create -f environment.yml
#   conda activate esr
#   pip install torch --index-url https://download.pytorch.org/whl/cu128
#   pip install sae-lens transformers accelerate anthropic python-dotenv numpy scipy pandas matplotlib seaborn tqdm huggingface_hub
name: esr
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
